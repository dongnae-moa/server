spring:
  application:
    name: dongnae-moa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dongnaemoa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:this-is-test-jwt-secret-lets-win-the-geeks-hackathon}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:10800000}

sdk:
  swagger:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /v1/**
